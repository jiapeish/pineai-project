# PineAI Backend 配置文件
# API密钥配置
api_keys:
  openai:
    key: "sk-proj-fixme"
  gemini:
    key: "fixme"

# 服务器配置
server:
  port: 8080
  host: "0.0.0.0"

# 模型默认配置
models:
  openai:
    default_model: "gpt-4o"
    max_tokens: 1000
    temperature: 0.7
  gemini:
    default_model: "gemini-pro"
    max_tokens: 1000
    temperature: 0.7 