<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .status-ready { color: #28a745; }
        .status-loading { color: #ffc107; }
        .status-error { color: #dc3545; }
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .model-card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }
        .model-card:hover {
            transform: translateY(-2px);
        }
        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <h4><i class="bi bi-cpu"></i> PineAI</h4>
                        <p class="text-muted">模型管理面板</p>
                    </div>
                    
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#dashboard">
                                <i class="bi bi-speedometer2"></i> 仪表板
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#models">
                                <i class="bi bi-collection"></i> 模型管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#metrics">
                                <i class="bi bi-graph-up"></i> 性能指标
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">仪表板</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="refreshData()">
                                <i class="bi bi-arrow-clockwise"></i> 刷新
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 统计卡片 -->
                <div class="row" id="stats">
                    <div class="col-md-3">
                        <div class="metric-card">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h3 id="totalModels">-</h3>
                                    <p class="mb-0">总模型数</p>
                                </div>
                                <i class="bi bi-collection fs-1"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="metric-card">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h3 id="readyModels">-</h3>
                                    <p class="mb-0">就绪模型</p>
                                </div>
                                <i class="bi bi-check-circle fs-1"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="metric-card">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h3 id="totalConnections">-</h3>
                                    <p class="mb-0">活跃连接</p>
                                </div>
                                <i class="bi bi-people fs-1"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="metric-card">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h3 id="lastUpdated">-</h3>
                                    <p class="mb-0">最后更新</p>
                                </div>
                                <i class="bi bi-clock fs-1"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 模型列表 -->
                <div class="row mt-4">
                    <div class="col-12">
                        <h4><i class="bi bi-collection"></i> 模型列表</h4>
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>模型名</th>
                                        <th>版本</th>
                                        <th>后端类型</th>
                                        <th>状态</th>
                                        <th>活跃连接</th>
                                        <th>配置</th>
                                        <th>更新时间</th>
                                    </tr>
                                </thead>
                                <tbody id="modelsTable">
                                    <!-- 动态填充 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 刷新按钮 -->
    <button class="btn btn-primary refresh-btn" onclick="refreshData()">
        <i class="bi bi-arrow-clockwise"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 获取面板数据
        async function fetchDashboardData() {
            try {
                const response = await fetch('/api/v1/dashboard');
                const data = await response.json();
                updateDashboard(data);
            } catch (error) {
                console.error('获取数据失败:', error);
            }
        }

        // 更新仪表板
        function updateDashboard(data) {
            // 更新统计信息
            document.getElementById('totalModels').textContent = data.total_models;
            document.getElementById('readyModels').textContent = data.ready_models;
            document.getElementById('totalConnections').textContent = data.total_connections;
            document.getElementById('lastUpdated').textContent = new Date(data.last_updated).toLocaleTimeString();

            // 更新模型表格
            const tbody = document.getElementById('modelsTable');
            tbody.innerHTML = '';

            data.models.forEach(model => {
                const row = document.createElement('tr');
                const statusClass = model.status === 'ready' ? 'status-ready' : 'status-error';
                const statusIcon = model.status === 'ready' ? 'bi-check-circle' : 'bi-x-circle';

                row.innerHTML = `
                    <td><strong>${model.name}</strong></td>
                    <td><span class="badge bg-secondary">${model.version}</span></td>
                    <td><span class="badge bg-info">${model.backend_type}</span></td>
                    <td><i class="bi ${statusIcon} ${statusClass}"></i> ${model.status}</td>
                    <td><span class="badge bg-primary">${model.active_connections}</span></td>
                    <td>
                        <small>
                            模型: ${model.config.model_name}<br>
                            Max Tokens: ${model.config.max_tokens}<br>
                            Temperature: ${model.config.temperature}
                        </small>
                    </td>
                    <td><small>${new Date(model.updated_at).toLocaleString()}</small></td>
                `;
                tbody.appendChild(row);
            });
        }

        // 刷新数据
        function refreshData() {
            fetchDashboardData();
        }

        // 页面加载时获取数据
        document.addEventListener('DOMContentLoaded', function() {
            fetchDashboardData();
            // 每30秒自动刷新
            setInterval(fetchDashboardData, 30000);
        });
    </script>
</body>
</html>
